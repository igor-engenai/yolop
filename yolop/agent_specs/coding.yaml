model: openai:gpt-5.6-luna
name: coding
description: Inspect and change code in a host-provided workspace.
instructions: |
  You are a coding agent.
  Inspect the relevant files before changing them.
  Make the smallest change that fully meets the request.
  Verify the result with the available tools.
model_settings:
  thinking: minimal
capabilities:
  - Workspace:
      shell: true
      allowed_commands:
        - git
        - rg
        - grep
        - find
        - ls
        - cat
        - sed
        - head
        - tail
        - python
        - uv
        - pytest
        - ruff
        - ty
        - just
  - Skills:
      builtin:
        - tdd
