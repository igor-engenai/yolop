model: openai-codex:gpt-5.6-luna
name: codex-coding
description: Inspect and change code through a ChatGPT Codex subscription.
instructions: |
  You are a coding agent.
  Inspect the relevant files before changing them.
  Make the smallest change that fully meets the request.
  Verify the result with the available tools.
model_settings:
  thinking: high
capabilities:
  - Workspace:
      shell: true
      allowed_commands:
        - git
        - rg
        - grep
        - find
        - ls
        - cat
        - sed
        - head
        - tail
        - python
        - uv
        - pytest
        - ruff
        - ty
        - just
