[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop"
version = "0.1.0"
description = "A small Pydantic AI runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[spec]>=2.31.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
workspace = ["yolop-workspace>=0.1.0,<0.2.0"]
context = ["yolop-context>=0.1.0,<0.2.0"]
duckdb = ["yolop-duckdb>=0.1.0,<0.2.0"]
web = ["yolop-webserver>=0.1.0,<0.2.0"]
tui = ["yolop-tui>=0.1.0,<0.2.0"]
openai = ["pydantic-ai-slim[openai]>=2.31.0"]
providers = ["yolop-providers>=0.1.0,<0.2.0"]
all = [
    "pydantic-ai-slim[openai]>=2.31.0",
    "yolop-context>=0.1.0,<0.2.0",
    "yolop-duckdb>=0.1.0,<0.2.0",
    "yolop-providers>=0.1.0,<0.2.0",
    "yolop-runtime>=0.1.0,<0.2.0",
    "yolop-sqlite-session>=0.1.0,<0.2.0",
    "yolop-tui>=0.1.0,<0.2.0",
    "yolop-webserver>=0.1.0,<0.2.0",
    "yolop-workspace>=0.1.0,<0.2.0",
    "yolop-workspace-session>=0.1.0,<0.2.0",
]

[project.entry-points."yolop.capabilities"]
Skills = "yolop.skills:Skills"


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pydantic-ai-slim[openai]>=2.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "yolop-context",
    "yolop-duckdb",
    "yolop-providers",
    "yolop-runtime",
    "yolop-sqlite-session",
    "yolop-tui",
    "yolop-webserver",
    "yolop-workspace",
    "yolop-workspace-session",
]

[tool.uv]
package = true

[tool.uv.sources]
yolop = { workspace = true }
yolop-context = { workspace = true }
yolop-duckdb = { workspace = true }
yolop-providers = { workspace = true }
yolop-runtime = { workspace = true }
yolop-sqlite-session = { workspace = true }
yolop-tui = { workspace = true }
yolop-webserver = { workspace = true }
yolop-workspace = { workspace = true }
yolop-workspace-session = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/yolop-context",
    "packages/yolop-duckdb",
    "packages/yolop-providers",
    "packages/yolop-runtime",
    "packages/yolop-sqlite-session",
    "packages/yolop-tui",
    "packages/yolop-webserver",
    "packages/yolop-workspace",
    "packages/yolop-workspace-session",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = [
    "tests",
    "packages/yolop-context/tests",
    "packages/yolop-duckdb/tests",
    "packages/yolop-providers/tests",
    "packages/yolop-runtime/tests",
    "packages/yolop-sqlite-session/tests",
    "packages/yolop-tui/tests",
    "packages/yolop-webserver/tests",
    "packages/yolop-workspace/tests",
    "packages/yolop-workspace-session/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["yolop", "tests", "examples", "packages"]
