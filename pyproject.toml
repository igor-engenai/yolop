[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop"
version = "0.1.0"
description = "A small Pydantic AI runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai,spec]>=2.31.0",
    "pyyaml>=6.0.3",
]

[project.entry-points."yolop.capabilities"]
Skills = "yolop.skills:Skills"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "yolop-workspace",
]

[tool.uv]
package = true

[tool.uv.sources]
yolop-workspace = { workspace = true }

[tool.uv.workspace]
members = ["packages/yolop-workspace"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests", "packages/yolop-workspace/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["yolop", "tests", "examples", "packages"]
