[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-runtime"
version = "0.1.0"
description = "Durable host-neutral Runtime facade for YoloP"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim>=2.31.0",
    "yolop>=0.1.0,<0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["yolop_runtime"]
