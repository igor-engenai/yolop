[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-postgres-runtime"
version = "0.1.0"
description = "PostgreSQL RuntimeStore for YoloP"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2.0",
    "yolop-runtime>=0.1.0,<0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["yolop_postgres_runtime"]
