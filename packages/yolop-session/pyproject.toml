[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-session"
version = "0.1.0"
description = "Runtime persistence contract for YoloP hosts"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim>=2.31.0"]

[tool.hatch.build.targets.wheel]
packages = ["yolop_session"]
