[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-deep"
version = "0.1.0"
description = "Durable deep-agent capabilities for YoloP"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-harness>=0.21.0,<0.22",
    "pydantic-ai-slim>=2.31.0",
    "yolop-context>=0.1.0,<0.2.0",
    "yolop-runtime>=0.1.0,<0.2.0",
    "yolop-workspace>=0.1.0,<0.2.0",
]

[project.entry-points."yolop.capabilities"]
Planning = "yolop_deep:Planning"

[tool.hatch.build.targets.wheel]
packages = ["yolop_deep"]
