[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-providers"
version = "0.1.0"
description = "Optional model providers for YoloP"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.20.0,<4",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.12.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["yolop_providers"]
