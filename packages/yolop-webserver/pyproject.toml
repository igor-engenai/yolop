[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-webserver"
version = "0.1.0"
description = "FastAPI host for YoloP agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1",
    "pydantic-ai-slim>=2.31.0",
    "sse-starlette>=3.0.0,<4",
    "uvicorn>=0.35.0,<1",
    "yolop>=0.1.0,<0.2.0",
    "yolop-session>=0.1.0,<0.2.0",
    "yolop-sqlite-session>=0.1.0,<0.2.0",
    "yolop-workspace-session>=0.1.0,<0.2.0",
]

[project.scripts]
yolop-webserver = "yolop_webserver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["yolop_webserver"]
