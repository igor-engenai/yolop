model: openai-codex:gpt-5.6-luna
name: coding
description: Inspect and change code in the current project workspace.
instructions: |
  You are a deep coding agent.
  Inspect the relevant files before changing them.
  Keep the durable plan current for multi-step work.
  Make the smallest change that fully meets the request.
  Verify the result with the available tools.
model_settings:
  thinking: high

capabilities:
  - Planning:
      enable_subtasks: true
      tools:
        - write_plan
        - read_plan
        - add_task
        - update_task_status
        - update_task_statuses
        - remove_task
        - add_subtask
        - set_dependency
        - get_available_tasks
  - StuckLoop: {}
  - WarnNearLimits:
      max_context_fraction: 0.8
  - Workspace:
      shell: true
      allowed_commands:
        - git
        - rg
        - grep
        - find
        - ls
        - cat
        - sed
        - head
        - tail
        - python
        - uv
        - pytest
        - ruff
        - ty
        - just
