[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-tui"
version = "0.1.0"
description = "Minimal inline terminal host for YoloP"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim>=2.31.0",
    "rich>=14.2.0,<15",
    "textual>=6,<7",
    "yolop>=0.1.0",
    "yolop-session>=0.1.0",
    "yolop-sqlite-session>=0.1.0",
    "yolop-workspace>=0.1.0",
]

[project.scripts]
yolop = "yolop_tui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["yolop_tui"]
