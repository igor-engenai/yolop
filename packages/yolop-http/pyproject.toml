[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-http"
version = "0.1.0"
description = "Safe bounded outbound HTTP for YoloP hosts"
requires-python = ">=3.12"
dependencies = [
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["yolop_http"]
