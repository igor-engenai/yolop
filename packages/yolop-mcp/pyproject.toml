[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolop-mcp"
version = "0.1.0"
description = "Host-authorized MCP toolsets for YoloP"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[mcp]>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["yolop_mcp"]
